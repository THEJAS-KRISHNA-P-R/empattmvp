<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1BA67E"/>
      <stop offset="100%" stop-color="#0D6E52"/>
    </linearGradient>

    <!-- Top Wing (Lighter) -->
    <linearGradient id="wing-top" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="100%" stop-color="#E2E8F0" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Bottom Wing (Slightly darker for 3D effect) -->
    <linearGradient id="wing-bottom" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D1FAE5" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#34D399" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Inner fold (Darkest to create depth) -->
    <linearGradient id="wing-inner" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6EE7B7" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0.8"/>
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#001F12" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Abstract Origami Bird / Glider -->
  <g filter="url(#shadow)">
    <!-- Top Wing -->
    <polygon points="120,320 400,160 160,160" fill="url(#wing-top)" />
    
    <!-- Bottom Wing -->
    <polygon points="120,320 400,160 320,380" fill="url(#wing-bottom)" />
    
    <!-- Inner Fold (Creates 3D origami look) -->
    <polygon points="120,320 400,160 240,240" fill="url(#wing-inner)" />
  </g>
</svg>
