name: empatt_mobile
description: "EmpAtt Field Worker GPS Attendance App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # GPS: coordinates, accuracy, and mock location detection via position.isMocked
  geolocator: ^14.0.0

  # Hardware ID: Settings.Secure.ANDROID_ID for 1:1 device binding.
  # NOT device_info_plus — see the long comment in device_service.dart for
  # why that package's `.id` field is the wrong value entirely (it's the OS
  # build label, not a per-device identifier; device_info_plus also removed
  # real ANDROID_ID access years ago).
  android_id: ^0.5.1

  # HTTP: REST calls to the Next.js backend on Vercel
  http: ^1.2.0

  # Local session persistence: stores worker ID/name after login
  shared_preferences: ^2.3.0

  # Offline clock-in queue: persists events locally when a clock-in/out
  # request fails, and connectivity_plus signals when to retry them. Without
  # this, a dropped network request silently loses the worker's attendance
  # event — see OfflineQueueService for details.
  sqflite: ^2.4.0
  path: ^1.9.0
  connectivity_plus: ^6.1.0

  # UI icons
  cupertino_icons: ^1.0.8
  intl: ^0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
