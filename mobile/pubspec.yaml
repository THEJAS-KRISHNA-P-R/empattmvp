name: empatt_mobile
description: "EmpAtt Field Worker GPS Attendance App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # GPS: coordinates, accuracy, and mock location detection via position.isMocked
  geolocator: ^13.0.0

  # Hardware UUID: persistent Android ID for 1:1 device binding
  device_info_plus: ^11.0.0

  # HTTP: REST calls to the Next.js backend on Vercel
  http: ^1.2.0

  # Local session persistence: stores worker ID/name after login
  shared_preferences: ^2.3.0

  # UI icons
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
